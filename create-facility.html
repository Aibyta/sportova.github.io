<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Sportova</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #3498db;
      --secondary-color: #2c3e50;
      --success-color: #27ae60;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
      --light-color: #f8f9fa;
      --dark-color: #343a40;
    }
    
    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .sidebar {
      min-height: 100vh;
      background-color: var(--secondary-color);
      padding: 1rem;
      color: white;
      width: 250px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }

    .sidebar a {
      display: block;
      margin: 0.3rem 0;
      color: #bdc3c7;
      text-decoration: none;
      padding: 12px 15px;
      border-radius: 5px;
      transition: all 0.3s;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: var(--primary-color);
      color: white;
    }

    iframe {
      border: none;
      width: calc(100vw - 250px);
      height: 100vh;
      margin-left: 250px;
      position: fixed;
      top: 0;
    }

    .profile-pic {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
      margin-right: 10px;
    }

    .profile-section {
      display: flex;
      align-items: center;
      padding: 1rem 0;
      margin-bottom: 1rem;
      border-bottom: 1px solid #495057;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
    }

    .profile-name {
      font-weight: bold;
      color: white;
      margin-bottom: 0.2rem;
      font-size: 1.1rem;
    }

    .profile-email {
      font-size: 0.8rem;
      color: #bdc3c7;
    }

    .admin-badge {
      background-color: var(--warning-color);
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-top: 5px;
    }

    .nav-items {
      margin-top: 1rem;
    }

    .logout-btn {
      position: absolute;
      bottom: 20px;
      width: calc(250px - 2rem);
      background-color: var(--danger-color);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-weight: 500;
    }

    .logout-btn:hover {
      background-color: #c82333;
      transform: translateY(-2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .website-logo {
      position: absolute;
      bottom: 70px;
      width: calc(250px - 2rem);
      text-align: center;
      padding: 10px 0;
    }

    .website-logo img {
      max-width: 80%;
      max-height: 50px;
      margin-bottom: 10px;
      border-radius: 5px;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .slogan {
      font-size: 0.65em;
      font-weight: 400;
      color: var(--primary-color);
      opacity: 0.9;
      margin-top: 2px;
    }

    .home-link {
      color: #bdc3c7;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
      margin-top: 10px;
      display: inline-block;
    }

    .home-link:hover {
      color: white;
    }
    
    /* Notification badge */
    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background-color: var(--danger-color);
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .nav-item-with-badge {
      position: relative;
    }
    
    /* Active link styling */
    .sidebar a.active {
      font-weight: 600;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        min-height: auto;
      }
      
      iframe {
        width: 100%;
        margin-left: 0;
        position: relative;
        height: calc(100vh - 200px);
      }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="profile-section">
        <img id="profilePicture" src="img/admin-profile.svg" alt="Profile" class="profile-pic">
        <div class="profile-info">
          <div id="adminName" class="profile-name">Admin</div>
          <div id="adminEmail" class="profile-email">Loading...</div>
          <span class="admin-badge">Super Admin</span>
        </div>
      </div>

      <div class="nav-items">
        <a href="dashboard.html" target="contentFrame" class="active">
          <i class="fas fa-home me-2"></i> Dashboard
        </a>
        <a href="create-facility.html" target="contentFrame">
          <i class="fas fa-plus me-2"></i> Create Facility
        </a>
        <a href="admin-booking-management.html" target="contentFrame" class="nav-item-with-badge">
          <i class="fas fa-calendar-alt me-2"></i> Booking Management
          <span class="notification-badge">3</span>
        </a>
        <a href="admin-manage-users.html" target="contentFrame">
          <i class="fas fa-users me-2"></i> Manage Users
        </a>
        <a href="admin-manage-coach.html" target="contentFrame">
          <i class="fas fa-user-tie me-2"></i> Manage Coach/Trainer
        </a>
        <a href="admin-pricing.html" target="contentFrame">
          <i class="fas fa-tag me-2"></i> Pricing Management
        </a>
        <a href="admin-equipment.html" target="contentFrame">
          <i class="fas fa-tools me-2"></i> Equipment
        </a>
        <a href="admin-marketplace.html" target="contentFrame">
          <i class="fas fa-store me-2"></i> Marketplace
        </a>
        <a href="admin-events.html" target="contentFrame">
          <i class="fas fa-calendar-week me-2"></i> Events & Leagues
        </a>
        <a href="admin-settings.html" target="contentFrame">
          <i class="fas fa-cog me-2"></i> Settings
        </a>
      </div>

      <div class="website-logo">
        <img src="img/logo.jpg" alt="Website Logo">
        <div class="slogan">Book. Play. Win</div>
        <a href="index.html" class="home-link">
          <i class="fas fa-arrow-left me-1"></i> Back to Homepage
        </a>
      </div>

      <button id="logoutBtn" onclick="logout()" class="logout-btn">
        <i class="fas fa-sign-out-alt me-1"></i> Logout
      </button>
    </div>

    <!-- Main Content Area -->
    <iframe name="contentFrame" src="dashboard.html"></iframe>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDjMwv9Bxff1bUE7CR_S-DPx3NV5kkinTU",
      authDomain: "nste-booking-system.firebaseapp.com",
      projectId: "nste-booking-system",
      storageBucket: "nste-booking-system.appspot.com",
      messagingSenderId: "574207536433",
      appId: "1:574207536433:web:0d2aeaacdc280cec019410"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    // Track if we're already logging out to prevent duplicate calls
    let isLoggingOut = false;

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById("adminName").textContent = user.displayName || "Admin";
        document.getElementById("adminEmail").textContent = user.email || "No email";

        // Set profile picture if available
        if (user.photoURL) {
          document.getElementById("profilePicture").src = user.photoURL;
        }
        
        // Update active link based on current iframe source
        updateActiveLink();
      } else {
        window.location.href = "login.html";
      }
    });

    function logout() {
      if (isLoggingOut) return;
      isLoggingOut = true;
      
      auth.signOut().then(() => {
        window.location.href = "login.html";
      }).catch((error) => {
        console.error("Logout error:", error);
        window.location.href = "login.html";
      });
    }

    // Update active link when iframe content changes
    function updateActiveLink() {
      const iframe = document.querySelector('iframe');
      const links = document.querySelectorAll('.sidebar a');
      
      iframe.addEventListener('load', function() {
        const currentSrc = iframe.contentWindow.location.pathname.split('/').pop();
        
        links.forEach(link => {
          link.classList.remove('active');
          const linkHref = link.getAttribute('href');
          if (linkHref === currentSrc) {
            link.classList.add('active');
          }
        });
      });
    }

    // Set active link on click
    document.querySelectorAll('.sidebar a').forEach(link => {
      link.addEventListener('click', function() {
        document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Handle page/tab close
    window.addEventListener('beforeunload', (event) => {
      if (auth.currentUser && !isLoggingOut) {
        // Use sendBeacon if available for more reliable logout
        if (navigator.sendBeacon) {
          const data = new Blob(
            [JSON.stringify({ uid: auth.currentUser.uid })],
            { type: 'application/json' }
          );
        }
      }
    });

    // Auto-logout after 30 minutes of inactivity
    let inactivityTimer;
    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(() => {
        if (auth.currentUser && !isLoggingOut) {
          logout();
        }
      }, 30 * 60 * 1000); // 30 minutes
    }

    // Events that reset the inactivity timer
    document.addEventListener('mousemove', resetInactivityTimer);
    document.addEventListener('keypress', resetInactivityTimer);
    document.addEventListener('click', resetInactivityTimer);
    
    // Start the timer when page loads
    resetInactivityTimer();
  </script>
</body>
</html>
