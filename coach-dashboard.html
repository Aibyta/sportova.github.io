<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sportova Coach Portal</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary: #4361ee;
      --primary-dark: #3a0ca3;
      --secondary: #4cc9f0;
      --accent: #f72585;
      --success: #06d6a0;
      --warning: #ffd166;
      --danger: #ef476f;
      --dark: #1a1a2e;
      --light-bg: #f0f4f9;
      --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      --card-hover: 0 12px 40px rgba(67, 97, 238, 0.15);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--light-bg);
      color: var(--dark);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 260px;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      padding: 1.2rem 1rem;
      z-index: 1000;
      transition: transform 0.3s ease;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
    }
    .sidebar.collapsed {
      transform: translateX(-100%);
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      padding: 0.5rem 0 1rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 1.5rem;
    }
    .sidebar-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      margin-right: 12px;
      object-fit: cover;
      background: #fff;
      padding: 4px;
    }
    .sidebar-title {
      font-weight: 800;
      font-size: 1.2rem;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sidebar-menu {
      list-style: none;
      padding: 0;
      flex-grow: 1;
    }
    .sidebar-menu li {
      margin-bottom: 0.2rem;
    }
    .sidebar-menu a {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      border-radius: 12px;
      transition: 0.2s;
      font-weight: 500;
      font-size: 0.95rem;
      gap: 12px;
    }
    .sidebar-menu a:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .sidebar-menu a.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
    }
    .sidebar-menu i {
      width: 22px;
      font-size: 1.1rem;
      text-align: center;
    }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .user-profile {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
    }
    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.15);
      margin-right: 12px;
    }
    .user-profile .fw-bold {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .user-profile small {
      opacity: 0.6;
      font-size: 0.75rem;
    }
    .sidebar-footer .btn {
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .sidebar-footer .btn-danger {
      background: var(--danger);
      border: none;
    }
    .sidebar-footer .btn-outline-light {
      border-color: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
    }
    .sidebar-footer .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      margin-left: 260px;
      padding: 20px 24px;
      transition: margin 0.3s ease;
      min-height: 100vh;
    }
    .main-content.expanded {
      margin-left: 0;
    }

    /* ===== HEADER ===== */
    .header {
      background: #fff;
      padding: 16px 24px;
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-weight: 800;
      font-size: 1.6rem;
      margin: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sidebar-toggle {
      background: none;
      border: none;
      color: var(--dark);
      font-size: 1.4rem;
      padding: 4px 8px;
      border-radius: 8px;
      transition: 0.2s;
    }
    .sidebar-toggle:hover {
      background: #f0f0f0;
    }

    /* ===== STATS CARDS ===== */
    .stats-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
      border: 1px solid rgba(0, 0, 0, 0.02);
      height: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .stats-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-hover);
    }
    .stats-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #fff;
      flex-shrink: 0;
    }
    .stats-icon.blue { background: linear-gradient(135deg, #4361ee, #3a0ca3); }
    .stats-icon.green { background: linear-gradient(135deg, #06d6a0, #059669); }
    .stats-icon.yellow { background: linear-gradient(135deg, #ffd166, #f59e0b); }
    .stats-icon.red { background: linear-gradient(135deg, #ef476f, #dc2626); }
    .stats-info {
      flex: 1;
      min-width: 0;
    }
    .stats-info .number {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .stats-info .label {
      font-size: 0.85rem;
      color: #6b7280;
      font-weight: 500;
    }

    /* ===== TABLE CARDS ===== */
    .table-card, .form-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(0, 0, 0, 0.02);
      margin-bottom: 24px;
    }
    .table-card h4, .form-card h4 {
      font-weight: 700;
      margin-bottom: 16px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .table-card h4 i, .form-card h4 i {
      color: var(--primary);
    }
    .table {
      margin-bottom: 0;
    }
    .table thead th {
      background: #f8fafc;
      border-bottom: 2px solid #e5e7eb;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4b5563;
      padding: 10px 12px;
    }
    .table tbody td {
      padding: 10px 12px;
      vertical-align: middle;
      border-color: #f1f3f5;
      font-size: 0.9rem;
    }
    .badge-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge-approved { background: #d1fae5; color: #065f46; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-cancelled { background: #fde2e2; color: #991b1b; }
    .badge-confirmed { background: #dbeafe; color: #1e40af; }

    /* ===== FORMS ===== */
    .form-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #374151;
    }
    .form-control, .form-select {
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      padding: 8px 14px;
      font-size: 0.9rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
    }
    .btn {
      border-radius: 10px;
      font-weight: 600;
      padding: 8px 18px;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      color: #fff;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67, 97, 238, 0.3);
    }
    .btn-danger {
      background: var(--danger);
      border: none;
    }
    .btn-danger:hover {
      background: #d9385a;
      transform: translateY(-2px);
    }

    /* ===== CHAT ===== */
    .chat-messages {
      height: 320px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      padding: 16px;
      background: #fafcff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .message-bubble {
      max-width: 78%;
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 0.9rem;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .message-bubble.sent {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message-bubble.received {
      background: #f1f5f9;
      color: var(--dark);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message-file {
      margin-top: 6px;
      max-width: 100%;
    }
    .message-file img, .message-file video {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
    .toast {
      border-radius: 12px;
      box-shadow: var(--card-hover);
      border: none;
    }

    /* ===== CHAT LIST ITEMS ===== */
    .chat-user-item {
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 10px;
      transition: 0.2s;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-user-item:hover {
      background: #f0f4f9;
      border-color: #e5e7eb;
    }
    .chat-user-item .user-avatar-small {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 992px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.show {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
      }
      .sidebar-toggle {
        display: inline-block;
      }
    }
    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.3rem;
      }
      .stats-card {
        padding: 16px;
      }
      .stats-icon {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }
      .stats-info .number {
        font-size: 1.4rem;
      }
      .table-card, .form-card {
        padding: 16px;
      }
      .btn {
        padding: 6px 14px;
        font-size: 0.8rem;
      }
    }
    @media (max-width: 576px) {
      .main-content {
        padding: 12px;
      }
      .header {
        padding: 12px 16px;
      }
      .stats-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .stats-icon {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }
      .table thead th, .table tbody td {
        padding: 6px 8px;
        font-size: 0.8rem;
      }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stats-card, .table-card, .form-card {
      animation: fadeSlideUp 0.4s ease forwards;
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="img/logo.jpg" alt="Sportova Logo" class="sidebar-logo" />
      <h5 class="sidebar-title">Coach Portal</h5>
    </div>

    <ul class="sidebar-menu">
      <li><a href="#" class="active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
      <li><a href="#" data-page="my-bookings"><i class="fas fa-calendar-check"></i> My Bookings</a></li>
      <li><a href="#" data-page="chat"><i class="fas fa-comments"></i> Chat</a></li>
      <li><a href="#" data-page="availability"><i class="fas fa-clock"></i> Availability</a></li>
      <li><a href="#" data-page="profile"><i class="fas fa-user"></i> Profile</a></li>
    </ul>

    <div class="sidebar-footer">
      <div class="user-profile">
        <img src="https://cdn-icons-png.freepik.com/512/10870/10870763.png" alt="Coach" class="user-avatar" id="coachAvatar" />
        <div>
          <div class="fw-bold" id="coachName">Coach</div>
          <small id="coachEmail">coach@sportova.com</small>
        </div>
      </div>
      <button class="btn btn-danger btn-sm w-100 mb-2" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
      <a href="index.html" class="btn btn-outline-light btn-sm w-100">
        <i class="fas fa-home"></i> Home
      </a>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="main-content" id="mainContent">
    <div class="header">
      <div>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div>
        <!-- optional extra controls -->
      </div>
    </div>
    <div id="pageContent">
      <!-- Dynamic content -->
    </div>
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ===== CHAT MODAL ===== -->
  <div class="modal fade" id="chatModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content" style="border-radius: var(--radius); border: none; box-shadow: var(--card-hover);">
        <div class="modal-header" style="border-bottom: 1px solid #e5e7eb;">
          <div class="d-flex align-items-center">
            <img id="chatUserAvatar" src="https://via.placeholder.com/40" alt="User" 
                 style="width:40px; height:40px; border-radius:50%; object-fit:cover; margin-right:12px;" />
            <div>
              <h5 class="modal-title" id="chatModalTitle" style="font-weight:700; font-size:1rem;">Chat</h5>
              <small id="chatUserStatus" class="text-muted" style="font-size:0.75rem;">User</small>
            </div>
          </div>
          <div>
            <button class="btn btn-sm btn-outline-secondary me-2" id="refreshChatBtn" title="Refresh messages">
              <i class="fas fa-sync-alt"></i>
            </button>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
        </div>
        <div class="modal-body" style="padding:16px;">
          <div id="chatMessages" class="chat-messages"></div>
          <div class="input-group mt-3">
            <input type="text" id="chatInput" class="form-control" placeholder="Type a message..." />
            <button class="btn btn-primary" id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

  <script>
    // ============================================================
    // SECURITY & INIT
    // ============================================================
    (function disableInspect() {
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
          (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 's')) {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'x' || e.key === 'v')) {
          const target = e.target;
          if (target.tagName !== 'INPUT' && target.tagName !== 'TEXTAREA' && target.tagName !== 'SELECT') {
            e.preventDefault();
            return false;
          }
        }
      });
    })();

    const firebaseConfig = {
      apiKey: "AIzaSyDjMwv9Bxff1bUE7CR_S-DPx3NV5kkinTU",
      authDomain: "nste-booking-system.firebaseapp.com",
      projectId: "nste-booking-system",
      storageBucket: "nste-booking-system.appspot.com",
      messagingSenderId: "574207536433",
      appId: "1:574207536433:web:0d2aeaacdc280cec019410"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentCoachData = null;
    let activeChatListener = null;
    let activeChatUserId = null;
    let bookingsUnsubscribe = null;
    let currentChatId = null;

    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const pageTitle = document.getElementById('pageTitle');
    const pageContent = document.getElementById('pageContent');
    const logoutBtn = document.getElementById('logoutBtn');
    const coachName = document.getElementById('coachName');
    const coachEmail = document.getElementById('coachEmail');
    const coachAvatar = document.getElementById('coachAvatar');

    // ============================================================
    // UTILITY FUNCTIONS
    // ============================================================
    function showToast(message, type = 'info', callback = null) {
      const toast = document.createElement('div');
      toast.className = `toast align-items-center text-white bg-${type} border-0`;
      toast.setAttribute('role', 'alert');
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body" style="cursor: ${callback ? 'pointer' : 'auto'}">
            <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'} me-2"></i>
            ${message}
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      document.getElementById('toastContainer').appendChild(toast);
      const bsToast = new bootstrap.Toast(toast);
      bsToast.show();
      toast.addEventListener('hidden.bs.toast', () => toast.remove());
      if (callback) {
        toast.querySelector('.toast-body').addEventListener('click', callback);
      }
    }

    function formatDate(timestamp) {
      if (!timestamp) return 'N/A';
      if (timestamp.toDate) return timestamp.toDate().toLocaleDateString();
      if (timestamp.seconds) return new Date(timestamp.seconds * 1000).toLocaleDateString();
      return new Date(timestamp).toLocaleDateString();
    }

    function formatTimeAgo(date) {
      if (!date) return '';
      const diff = (Date.now() - date.getTime()) / 1000;
      if (diff < 60) return 'Just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return date.toLocaleDateString();
    }

    function generateChatId(id1, id2) {
      return [id1, id2].sort().join("_");
    }

    async function createNotification(userId, type, title, message, data = {}) {
      try {
        await db.collection('notifications').add({
          userId,
          type,
          title,
          message,
          data,
          isRead: false,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) {
        console.error('Notification error:', e);
      }
    }

    // ============================================================
    // AUTH STATE
    // ============================================================
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        try {
          const coachQuery = await db.collection('coaches')
            .where('userId', '==', user.uid)
            .get();
          if (coachQuery.empty) {
            showToast('You are not registered as a coach. Please contact admin.', 'danger');
            setTimeout(() => window.location.href = 'login.html', 2000);
            return;
          }
          const coachDoc = coachQuery.docs[0];
          currentCoachData = { id: coachDoc.id, ...coachDoc.data() };

          coachName.textContent = currentCoachData.name || 'Coach';
          coachEmail.textContent = user.email;
          if (currentCoachData.photoURL) coachAvatar.src = currentCoachData.photoURL;

          if (currentCoachData.id) {
            startBookingListener(currentCoachData.id);
          }

          const savedPage = localStorage.getItem('coachPage') || 'dashboard';
          navigateTo(savedPage);
        } catch (error) {
          console.error('Error fetching coach data:', error);
          showToast('Error loading coach profile.', 'danger');
        }
      } else {
        window.location.href = 'login.html';
      }
    });

    // ============================================================
    // REAL-TIME BOOKING LISTENER
    // ============================================================
    function startBookingListener(coachId) {
      if (bookingsUnsubscribe) {
        bookingsUnsubscribe();
        bookingsUnsubscribe = null;
      }

      bookingsUnsubscribe = db.collection('bookings')
        .where('coach.id', '==', coachId)
        .onSnapshot((snapshot) => {
          const currentPage = localStorage.getItem('coachPage') || 'dashboard';
          if (currentPage === 'my-bookings' || currentPage === 'dashboard') {
            loadPage(currentPage);
          }
        }, (error) => {
          console.error('Booking listener error:', error);
          showToast('Error loading bookings. Please refresh.', 'danger');
        });
    }

    // ============================================================
    // SIDEBAR TOGGLE
    // ============================================================
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('show');
    });
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 992) {
        if (!sidebar.contains(e.target) && e.target !== sidebarToggle) {
          sidebar.classList.remove('show');
        }
      }
    });

    // ============================================================
    // NAVIGATION
    // ============================================================
    document.querySelectorAll('.sidebar-menu a').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const page = this.getAttribute('data-page');
        navigateTo(page);
        if (window.innerWidth <= 992) sidebar.classList.remove('show');
      });
    });

    logoutBtn.addEventListener('click', () => {
      if (confirm('Logout?')) {
        auth.signOut().then(() => {
          localStorage.removeItem('coachPage');
          window.location.href = 'login.html';
        });
      }
    });

    function navigateTo(page) {
      document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
      const activeLink = document.querySelector(`.sidebar-menu a[data-page="${page}"]`);
      if (activeLink) activeLink.classList.add('active');
      localStorage.setItem('coachPage', page);
      pageTitle.textContent = page.charAt(0).toUpperCase() + page.slice(1);
      loadPage(page);
    }

    // ============================================================
    // PAGE LOADER
    // ============================================================
    function loadPage(page) {
      switch (page) {
        case 'dashboard': loadDashboard(); break;
        case 'my-bookings': loadMyBookings(); break;
        case 'chat': loadChatPage(); break;
        case 'availability': loadAvailabilityPage(); break;
        case 'profile': loadProfilePage(); break;
        default: pageContent.innerHTML = '<div class="alert alert-info">Page under development</div>';
      }
    }

    // ============================================================
    // DASHBOARD
    // ============================================================
    async function getCoachBookings() {
      if (!currentUser || !currentCoachData) return [];
      try {
        const snapshot = await db.collection('bookings')
          .where('coach.id', '==', currentCoachData.id)
          .get();
        const bookings = [];
        snapshot.forEach(doc => bookings.push({ id: doc.id, ...doc.data() }));
        bookings.sort((a, b) => {
          const dateA = a.date ? (a.date.toDate ? a.date.toDate() : new Date(a.date)) : new Date(0);
          const dateB = b.date ? (b.date.toDate ? b.date.toDate() : new Date(b.date)) : new Date(0);
          return dateB - dateA;
        });
        return bookings;
      } catch (e) {
        console.error('Error fetching bookings:', e);
        return [];
      }
    }

    async function loadDashboard() {
      const bookings = await getCoachBookings();
      const stats = {
        total: bookings.length,
        confirmed: bookings.filter(b => b.status === 'confirmed' || b.status === 'approved').length,
        pending: bookings.filter(b => b.status === 'pending').length,
        cancelled: bookings.filter(b => b.status === 'cancelled').length,
      };
      pageContent.innerHTML = `
        <div class="row g-4">
          <div class="col-6 col-md-3">
            <div class="stats-card">
              <div class="stats-icon blue"><i class="fas fa-calendar-check"></i></div>
              <div class="stats-info">
                <div class="number">${stats.total}</div>
                <div class="label">Total Bookings</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stats-card">
              <div class="stats-icon green"><i class="fas fa-check-circle"></i></div>
              <div class="stats-info">
                <div class="number">${stats.confirmed}</div>
                <div class="label">Confirmed</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stats-card">
              <div class="stats-icon yellow"><i class="fas fa-clock"></i></div>
              <div class="stats-info">
                <div class="number">${stats.pending}</div>
                <div class="label">Pending</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stats-card">
              <div class="stats-icon red"><i class="fas fa-times-circle"></i></div>
              <div class="stats-info">
                <div class="number">${stats.cancelled}</div>
                <div class="label">Cancelled</div>
              </div>
            </div>
          </div>
        </div>
        <div class="table-card mt-4">
          <h4><i class="fas fa-history"></i> Recent Bookings</h4>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead><tr><th>User</th><th>Facility</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
              <tbody id="recentBookingsCoach"></tbody>
            </table>
          </div>
        </div>
      `;
      const tbody = document.getElementById('recentBookingsCoach');
      tbody.innerHTML = '';
      if (bookings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No bookings assigned.</td></tr>';
      } else {
        bookings.slice(0, 5).forEach(b => {
          const date = formatDate(b.date);
          tbody.innerHTML += `
            <tr>
              <td><i class="fas fa-user-circle me-2" style="color: var(--primary);"></i>${b.userName || 'User'}</td>
              <td>${b.facilityName || 'Facility'}</td>
              <td>${date}</td>
              <td>${b.time || b.slot || 'N/A'}</td>
              <td><span class="badge badge-status badge-${b.status || 'pending'}">${b.status || 'pending'}</span></td>
            </tr>
          `;
        });
      }
    }

    // ============================================================
    // MY BOOKINGS
    // ============================================================
    async function loadMyBookings() {
      const bookings = await getCoachBookings();
      let html = `
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4></h4>
          <button class="btn btn-outline-primary btn-sm" onclick="loadMyBookings()">
            <i class="fas fa-sync-alt"></i> Refresh
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>User</th><th>Facility</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
      `;
      if (bookings.length === 0) {
        html += `<tr><td colspan="6" class="text-center text-muted">No bookings found.</td></tr>`;
      } else {
        bookings.forEach(b => {
          const date = formatDate(b.date);
          html += `
            <tr>
              <td><i class="fas fa-user-circle me-2" style="color: var(--primary);"></i>${b.userName || 'User'}</td>
              <td>${b.facilityName || 'Facility'}</td>
              <td>${date}</td>
              <td>${b.time || b.slot || 'N/A'}</td>
              <td><span class="badge badge-status badge-${b.status || 'pending'}">${b.status || 'pending'}</span></td>
              <td>
                <button class="btn btn-sm btn-primary chat-with-user" data-userid="${b.userId}" data-bookingid="${b.id}"><i class="fas fa-comment"></i></button>
                ${b.status !== 'cancelled' ? `<button class="btn btn-sm btn-danger cancel-booking" data-id="${b.id}"><i class="fas fa-times"></i></button>` : ''}
              </td>
            </tr>
          `;
        });
      }
      html += `</tbody></table></div>`;
      pageContent.innerHTML = html;

      document.querySelectorAll('.chat-with-user').forEach(btn => {
        btn.addEventListener('click', function() {
          const userId = this.dataset.userid;
          openChatModal(userId);
        });
      });

      document.querySelectorAll('.cancel-booking').forEach(btn => {
        btn.addEventListener('click', async function() {
          const id = this.dataset.id;
          if (!confirm('Cancel this booking? The user will be notified.')) return;
          try {
            await db.collection('bookings').doc(id).update({
              status: 'cancelled',
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            const booking = (await db.collection('bookings').doc(id).get()).data();
            await createNotification(
              booking.userId,
              'booking_cancelled_coach',
              'Booking Cancelled by Coach',
              `Your booking for ${booking.facilityName} on ${formatDate(booking.date)} has been cancelled by the coach.`,
              { bookingId: id, facilityId: booking.facilityId }
            );
            showToast('Booking cancelled, user notified.', 'success');
            loadMyBookings();
          } catch (e) {
            console.error(e);
            showToast('Error cancelling booking.', 'danger');
          }
        });
      });
    }

    // ============================================================
    // CHAT PAGE
    // ============================================================
    function loadChatPage() {
      pageContent.innerHTML = `
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="table-card">
              <h4><i class="fas fa-users"></i> Your User Chats</h4>
              <div id="userChatList"></div>
            </div>
          </div>
          <div class="col-lg-8">
            <div class="table-card">
              <h4><i class="fas fa-comment-dots"></i> Chat</h4>
              <div id="chatDisplay">
                <div class="text-center text-muted py-5">
                  <i class="fas fa-comments fa-3x mb-3" style="color: var(--primary); opacity: 0.3;"></i>
                  <p>Select a user to start chatting.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      loadUserChatList();
    }

    async function loadUserChatList() {
      const bookings = await getCoachBookings();
      const userIds = [...new Set(bookings.map(b => b.userId).filter(id => id))];
      const container = document.getElementById('userChatList');
      container.innerHTML = '';
      if (userIds.length === 0) {
        container.innerHTML = '<p class="text-muted">No users have booked with you yet.</p>';
        return;
      }
      for (const uid of userIds) {
        const userDoc = await db.collection('users').doc(uid).get();
        const name = userDoc.exists ? userDoc.data().name || 'User' : 'User';
        const photo = userDoc.exists ? userDoc.data().photoURL : null;
        const div = document.createElement('div');
        div.className = 'chat-user-item';
        div.innerHTML = `
          <img src="${photo || 'https://via.placeholder.com/40'}" class="user-avatar-small" />
          <div>
            <div style="font-weight:600; font-size:0.95rem;">${name}</div>
            <small class="text-muted">Click to chat</small>
          </div>
        `;
        div.addEventListener('click', () => openChatModal(uid));
        container.appendChild(div);
      }
    }

    // ============================================================
    // CHAT MODAL (FIXED: use coach's Firestore doc ID, with file support)
    // ============================================================
    let chatModalListener = null;

    function openChatModal(userId) {
      if (!userId) {
        showToast('Invalid user.', 'danger');
        return;
      }

      const coachId = currentCoachData.id;
      const chatId = generateChatId(coachId, userId);
      currentChatId = chatId;

      console.log('[Coach] Opening chat with userId:', userId);
      console.log('[Coach] Using coachId (Firestore doc ID):', coachId);
      console.log('[Coach] ChatId:', chatId);

      // Fetch user details for header
      db.collection('users').doc(userId).get().then(doc => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('chatModalTitle').textContent = data.name || 'User';
          document.getElementById('chatUserStatus').textContent = data.email || 'User';
          document.getElementById('chatUserAvatar').src = data.photoURL || 'https://via.placeholder.com/40';
        } else {
          document.getElementById('chatModalTitle').textContent = 'User';
          document.getElementById('chatUserStatus').textContent = 'User';
          document.getElementById('chatUserAvatar').src = 'https://via.placeholder.com/40';
        }
      }).catch(() => {
        document.getElementById('chatModalTitle').textContent = 'User';
        document.getElementById('chatUserStatus').textContent = 'User';
        document.getElementById('chatUserAvatar').src = 'https://via.placeholder.com/40';
      });

      // Detach old listener
      if (chatModalListener) {
        chatModalListener();
        chatModalListener = null;
      }

      const messagesContainer = document.getElementById('chatMessages');
      messagesContainer.innerHTML = '<div class="text-center text-muted py-3">Loading messages...</div>';

      // Show modal
      const modal = new bootstrap.Modal(document.getElementById('chatModal'));
      modal.show();

      // Function to load messages (used for initial load and refresh)
      const loadMessages = () => {
        if (chatModalListener) {
          chatModalListener();
          chatModalListener = null;
        }

        // First, fetch messages once to show immediately
        db.collection('messages')
          .where('chatId', '==', chatId)
          .orderBy('timestamp', 'asc')
          .get()
          .then(snapshot => {
            console.log(`[Coach] Fetched ${snapshot.size} messages for chatId: ${chatId}`);
            messagesContainer.innerHTML = '';
            if (snapshot.empty) {
              messagesContainer.innerHTML = '<div class="text-center text-muted py-3">No messages yet. Start the conversation!</div>';
            } else {
              snapshot.forEach(doc => {
                const msg = doc.data();
                const div = document.createElement('div');
                div.className = `message-bubble ${msg.senderId === coachId ? 'sent' : 'received'}`;
                // Build message content with file support
                let content = '';
                if (msg.text) {
                  content += `<div class="message-text">${msg.text}</div>`;
                }
                if (msg.fileUrl) {
                  const fileUrl = msg.fileUrl;
                  if (fileUrl.match(/\.(mp4|mov|avi|wmv|webm)$/i)) {
                    content += `
                      <div class="message-file">
                        <video controls style="max-width:100%; max-height:200px; border-radius:8px;">
                          <source src="${fileUrl}">
                          Your browser does not support the video tag.
                        </video>
                      </div>
                    `;
                  } else {
                    content += `
                      <div class="message-file">
                        <img src="${fileUrl}" alt="Image" style="max-width:100%; max-height:200px; border-radius:8px; cursor:pointer;" 
                             onclick="window.open('${fileUrl}','_blank')" />
                      </div>
                    `;
                  }
                }
                div.innerHTML = content;
                messagesContainer.appendChild(div);
              });
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
          })
          .catch(err => {
            console.error('[Coach] Error fetching messages:', err);
            messagesContainer.innerHTML = '<div class="text-center text-danger py-3">Error loading messages.</div>';
          });

        // Now set up real-time listener
        chatModalListener = db.collection('messages')
          .where('chatId', '==', chatId)
          .orderBy('timestamp', 'asc')
          .onSnapshot(snapshot => {
            console.log(`[Coach] Listener got ${snapshot.size} messages for chatId: ${chatId}`);
            if (snapshot.empty) {
              if (messagesContainer.querySelector('.message-bubble') === null) {
                messagesContainer.innerHTML = '<div class="text-center text-muted py-3">No messages yet. Start the conversation!</div>';
              }
              return;
            }
            messagesContainer.innerHTML = '';
            snapshot.forEach(doc => {
              const msg = doc.data();
              const div = document.createElement('div');
              div.className = `message-bubble ${msg.senderId === coachId ? 'sent' : 'received'}`;
              let content = '';
              if (msg.text) {
                content += `<div class="message-text">${msg.text}</div>`;
              }
              if (msg.fileUrl) {
                const fileUrl = msg.fileUrl;
                if (fileUrl.match(/\.(mp4|mov|avi|wmv|webm)$/i)) {
                  content += `
                    <div class="message-file">
                      <video controls style="max-width:100%; max-height:200px; border-radius:8px;">
                        <source src="${fileUrl}">
                        Your browser does not support the video tag.
                      </video>
                    </div>
                  `;
                } else {
                  content += `
                    <div class="message-file">
                      <img src="${fileUrl}" alt="Image" style="max-width:100%; max-height:200px; border-radius:8px; cursor:pointer;" 
                           onclick="window.open('${fileUrl}','_blank')" />
                    </div>
                  `;
                }
              }
              div.innerHTML = content;
              messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
          }, error => {
            console.error('[Coach] Listener error:', error);
            messagesContainer.innerHTML = '<div class="text-center text-danger py-3">Error loading messages.</div>';
          });
      };

      // Initial load
      loadMessages();

      // Refresh button
      document.getElementById('refreshChatBtn').onclick = () => {
        showToast('Refreshing messages...', 'info');
        loadMessages();
      };

      // Clean up on modal hide
      document.getElementById('chatModal').addEventListener('hidden.bs.modal', function cleanup() {
        if (chatModalListener) {
          chatModalListener();
          chatModalListener = null;
        }
        document.getElementById('refreshChatBtn').onclick = null;
        this.removeEventListener('hidden.bs.modal', cleanup);
      }, { once: true });

      // Send message handler
      const sendBtn = document.getElementById('sendChatBtn');
      const input = document.getElementById('chatInput');

      const sendMessage = async () => {
        const text = input.value.trim();
        if (!text) return;
        try {
          await db.collection('messages').add({
            chatId,
            senderId: coachId,
            receiverId: userId,
            text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          await db.collection('chats').doc(chatId).set({
            participants: [coachId, userId],
            lastMessage: text,
            lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          input.value = '';
        } catch (e) {
          console.error(e);
          showToast('Error sending message.', 'danger');
        }
      };

      sendBtn.onclick = sendMessage;
      input.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
    }

    // ============================================================
    // AVAILABILITY
    // ============================================================
    async function loadAvailabilityPage() {
      const coachFacilities = currentCoachData.facilities || [];
      let html = `
        <div class="form-card">
          <h4><i class="fas fa-clock"></i> Set Your Availability</h4>
          <p class="text-muted">Update the time slots you are available for each assigned facility.</p>
      `;
      if (coachFacilities.length === 0) {
        html += `<div class="alert alert-info">You are not assigned to any facility. Contact admin.</div>`;
      } else {
        for (const fid of coachFacilities) {
          try {
            const fDoc = await db.collection('facilities').doc(fid).get();
            if (fDoc.exists) {
              const f = fDoc.data();
              const slots = f.slots || [];
              html += `
                <div class="mb-4 border p-3 rounded" style="background: #fafcff; border: 1px solid #e5e7eb;">
                  <h5><i class="fas fa-dumbbell me-2" style="color: var(--primary);"></i>${f.name}</h5>
                  <div class="form-group">
                    <label class="form-label">Your Available Time Slots (comma separated, e.g. 09:00-10:00, 10:00-11:00)</label>
                    <input type="text" class="form-control coach-slots" data-facility="${fid}" value="${slots.join(', ')}">
                  </div>
                  <button class="btn btn-primary btn-sm update-slots mt-2" data-facility="${fid}">Update Slots</button>
                </div>
              `;
            }
          } catch (e) {
            console.error('Error loading facility:', e);
          }
        }
      }
      html += `</div>`;
      pageContent.innerHTML = html;

      document.querySelectorAll('.update-slots').forEach(btn => {
        btn.addEventListener('click', async function() {
          const fid = this.dataset.facility;
          const input = document.querySelector(`.coach-slots[data-facility="${fid}"]`);
          const slots = input.value.split(',').map(s => s.trim()).filter(s => s);
          try {
            await db.collection('facilities').doc(fid).update({ slots });
            showToast('Availability updated!', 'success');
          } catch (e) {
            console.error(e);
            showToast('Error updating slots.', 'danger');
          }
        });
      });
    }

    // ============================================================
    // PROFILE
    // ============================================================
    function loadProfilePage() {
      pageContent.innerHTML = `
        <div class="form-card">
          <h4><i class="fas fa-user-edit"></i> Coach Profile</h4>
          <form id="coachProfileForm">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="coachProfileName" value="${currentCoachData.name || ''}">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" value="${currentUser.email}" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Experience (years)</label>
              <input type="number" class="form-control" id="coachProfileExperience" value="${currentCoachData.experience || 0}">
            </div>
            <div class="mb-3">
              <label class="form-label">Rate (RM/hour)</label>
              <input type="number" class="form-control" id="coachProfileRate" value="${currentCoachData.rate || 0}">
            </div>
            <div class="mb-3">
              <label class="form-label">Bio</label>
              <textarea class="form-control" id="coachProfileBio" rows="3">${currentCoachData.bio || ''}</textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Update Profile</button>
          </form>
        </div>
      `;
      document.getElementById('coachProfileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('coachProfileName').value.trim();
        const experience = parseInt(document.getElementById('coachProfileExperience').value) || 0;
        const rate = parseFloat(document.getElementById('coachProfileRate').value) || 0;
        const bio = document.getElementById('coachProfileBio').value.trim();
        try {
          await db.collection('coaches').doc(currentCoachData.id).update({
            name,
            experience,
            rate,
            bio,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          showToast('Profile updated successfully!', 'success');
          currentCoachData = { ...currentCoachData, name, experience, rate, bio };
          coachName.textContent = name;
        } catch (e) {
          console.error(e);
          showToast('Error updating profile.', 'danger');
        }
      });
    }
  </script>

</body>
</html>
