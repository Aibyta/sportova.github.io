<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Partner | NSTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
        }
        .chat-header img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid white;
        }
        .chat-messages {
            height: 500px;
            overflow-y: auto;
            padding: 1.5rem;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            max-width: 70%;
        }
        .message-sent {
            margin-left: auto;
            text-align: right;
        }
        .message-received {
            margin-right: auto;
        }
        .message-bubble {
            padding: 10px 15px;
            border-radius: 18px;
            display: inline-block;
            position: relative;
            word-wrap: break-word;
        }
        .sent-bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 0;
        }
        .received-bubble {
            background: #e9ecef;
            color: #212529;
            border-bottom-left-radius: 0;
        }
        .message-time {
            font-size: 0.75rem;
            color: #000000;
            margin-top: 5px;
        }
        .chat-input {
            padding: 1rem;
            border-top: 1px solid #e9ecef;
            background: #fff;
        }
        .typing-indicator {
            font-size: 0.8rem;
            color: #6c757d;
            padding: 0 1.5rem 10px;
            font-style: italic;
        }
        .empty-chat {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        .empty-chat i {
            font-size: 4rem;
            color: #e9ecef;
            margin-bottom: 1rem;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
        }
        .status-online {
            background-color: #28a745;
        }
        .status-offline {
            background-color: #6c757d;
        }
        .file-preview {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px;
            max-width: 100%;
        }
        .file-preview img {
            display: block;
            max-height: 200px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="chat-container">
            <div class="chat-header">
                <a href="find-friend.html" class="text-white me-3"><i class="bi bi-arrow-left"></i></a>
                <img id="friendAvatar" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_640.png" alt="Friend">
                <div>
                    <h5 id="friendName" class="mb-0">Tennis Partner</h5>
                    <small id="friendStatus" class="text-white-50">
                        <span id="statusText">Offline</span>
                        <span class="status-indicator status-offline" id="statusDot"></span>
                    </small>
                </div>
            </div>
            
            <div id="typingIndicator" class="typing-indicator d-none">
                <span id="friendNameTyping"></span> is typing...
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat" id="emptyChat">
                    <i class="bi bi-chat-square-text"></i>
                    <h4>No messages yet</h4>
                    <p class="text-muted">Start the conversation with your tennis partner</p>
                </div>
            </div>
            
            <div class="chat-input">
                <div class="input-group">
                    <input type="text" class="form-control" id="messageInput" placeholder="Type your message...">
                    <button class="btn btn-primary" id="sendButton" type="button">
                        <i class="bi bi-send"></i>
                    </button>
                </div>
                <div class="d-flex justify-content-between mt-2">
                    <div>
                        <button class="btn btn-sm btn-outline-secondary" id="attachmentButton">
                            <i class="bi bi-paperclip"></i>
                        </button>
                        <input type="file" id="fileInput" style="display: none;" accept="image/*, .pdf, .doc, .docx, .txt">
                    </div>
                    <small class="text-muted" id="characterCount">0/500</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjMwv9Bxff1bUE7CR_S-DPx3NV5kkinTU",
            authDomain: "nste-booking-system.firebaseapp.com",
            projectId: "nste-booking-system",
            storageBucket: "nste-booking-system.appspot.com",
            messagingSenderId: "574207536433",
            appId: "1:574207536433:web:0d2aeaacdc280cec019410"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        let currentUser = null;
        let chatId = null;
        let friendData = null;
        let isTyping = false;
        let typingTimeout = null;

        // DOM Elements
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatMessages = document.getElementById('chatMessages');
        const emptyChat = document.getElementById('emptyChat');
        const friendName = document.getElementById('friendName');
        const friendAvatar = document.getElementById('friendAvatar');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const typingIndicator = document.getElementById('typingIndicator');
        const friendNameTyping = document.getElementById('friendNameTyping');
        const attachmentButton = document.getElementById('attachmentButton');
        const fileInput = document.getElementById('fileInput');
        const characterCount = document.getElementById('characterCount');

        // Security: Sanitize text content
        function sanitizeText(text) {
            if (!text) return '';
            const temp = document.createElement('div');
            temp.textContent = text;
            return temp.textContent;
        }

        // Security: Sanitize URLs
        function sanitizeUrl(url) {
            if (!url) return '';
            try {
                const parsedUrl = new URL(url);
                if (parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:') {
                    return '';
                }
                return url;
            } catch (e) {
                return '';
            }
        }

        // Security: Create safe DOM element
        function createSafeElement(tag, content, attributes = {}) {
            const element = document.createElement(tag);
            if (content !== undefined && content !== null) {
                element.textContent = content;
            }
            for (const [key, value] of Object.entries(attributes)) {
                if (key === 'src' || key === 'href') {
                    element.setAttribute(key, sanitizeUrl(value));
                } else {
                    element.setAttribute(key, value);
                }
            }
            return element;
        }

        // Initialize chat
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                initializeChat();
            } else {
                auth.signInAnonymously().catch(error => {
                    console.error("Authentication error:", error);
                    alert("Error initializing chat. Please refresh the page.");
                });
            }
        });

        function initializeChat() {
            const chatWithFriend = sessionStorage.getItem('chatWithFriend');
            if (chatWithFriend) {
                friendData = JSON.parse(chatWithFriend);
                // Sanitize friend name
                const safeName = sanitizeText(friendData.name);
                friendName.textContent = safeName;
                friendNameTyping.textContent = safeName;
                
                const userIds = [currentUser.uid, friendData.id].sort();
                chatId = userIds.join('_');
                
                loadFriendProfile();
                loadMessages();
                setupListeners();
            } else {
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert alert-danger';
                alertDiv.textContent = 'No chat partner selected. Please go back and select a partner to chat with.';
                chatMessages.innerHTML = '';
                chatMessages.appendChild(alertDiv);
            }

            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            messageInput.addEventListener('input', () => {
                updateCharacterCount();
                if (!isTyping && messageInput.value.trim() !== '') {
                    isTyping = true;
                    db.collection('chats').doc(chatId).update({
                        [`typing.${currentUser.uid}`]: true
                    });
                }
                
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    isTyping = false;
                    db.collection('chats').doc(chatId).update({
                        [`typing.${currentUser.uid}`]: false
                    });
                }, 3000);
            });
            
            attachmentButton.addEventListener('click', () => {
                fileInput.click();
            });
            
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (file.size > 5 * 1024 * 1024) {
                    alert('File size too large. Maximum 5MB allowed.');
                    return;
                }
                
                uploadFile(file);
                fileInput.value = '';
            });
        }

        function loadFriendProfile() {
            db.collection('users').doc(friendData.id).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.photoURL) {
                        const sanitizedUrl = sanitizeUrl(data.photoURL);
                        if (sanitizedUrl) {
                            friendAvatar.src = sanitizedUrl;
                        }
                    }
                }
            });
        }

        function formatLastSeen(timestamp) {
            if (!timestamp) return 'recently';
            
            const now = new Date();
            const lastSeen = timestamp.toDate();
            const diffInMinutes = Math.floor((now - lastSeen) / (1000 * 60));
            
            if (diffInMinutes < 1) return 'just now';
            if (diffInMinutes < 60) return `${diffInMinutes} min ago`;
            if (diffInMinutes < 1440) return `${Math.floor(diffInMinutes / 60)} hours ago`;
            return `${Math.floor(diffInMinutes / 1440)} days ago`;
        }

        function loadMessages() {
            db.collection('chats').doc(chatId).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    if (snapshot.empty) {
                        emptyChat.classList.remove('d-none');
                        return;
                    }
                    
                    emptyChat.classList.add('d-none');
                    // Clear messages safely
                    while (chatMessages.firstChild) {
                        chatMessages.removeChild(chatMessages.firstChild);
                    }
                    
                    snapshot.forEach(doc => {
                        const message = doc.data();
                        addMessageToChat(message, doc.id);
                    });
                    
                    setTimeout(() => {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }, 100);
                });
        }

        function setupListeners() {
            db.collection('chats').doc(chatId).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.typing && data.typing[friendData.id]) {
                        typingIndicator.classList.remove('d-none');
                    } else {
                        typingIndicator.classList.add('d-none');
                    }
                }
            });
            
            db.collection('status').doc(friendData.id).onSnapshot(doc => {
                if (doc.exists) {
                    const status = doc.data();
                    const isOnline = status.state === 'online';
                    statusText.textContent = isOnline ? 'Online' : 'Offline';
                    statusDot.className = isOnline ? 'status-indicator status-online' : 'status-indicator status-offline';
                    
                    if (!isOnline && status.last_changed) {
                        statusText.textContent = 'Last seen ' + formatLastSeen(status.last_changed);
                    }
                } else {
                    statusText.textContent = 'Offline';
                    statusDot.className = 'status-indicator status-offline';
                }
            });
        }

        function addMessageToChat(message, messageId) {
            const isSent = message.sender === currentUser.uid;
            const messageTime = message.timestamp ? message.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now';
            
            // Check if message already exists
            if (document.getElementById(messageId)) {
                return;
            }
            
            const messageElement = document.createElement('div');
            messageElement.className = `message ${isSent ? 'message-sent' : 'message-received'}`;
            messageElement.id = messageId;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `message-bubble ${isSent ? 'sent-bubble' : 'received-bubble'}`;
            
            // Add message content safely
            if (message.fileUrl) {
                // Handle file message
                const fileContent = createFileMessageContent(message);
                // Append file content to bubble
                while (bubbleDiv.firstChild) {
                    bubbleDiv.removeChild(bubbleDiv.firstChild);
                }
                bubbleDiv.appendChild(fileContent);
            } else {
                // Text message - sanitize
                const textSpan = document.createElement('span');
                textSpan.textContent = sanitizeText(message.text);
                bubbleDiv.appendChild(textSpan);
            }
            
            // Add timestamp
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = messageTime;
            bubbleDiv.appendChild(timeDiv);
            
            messageElement.appendChild(bubbleDiv);
            chatMessages.appendChild(messageElement);
        }

        function createFileMessageContent(message) {
            const container = document.createElement('div');
            container.className = 'file-preview mb-2';
            
            if (message.fileType && message.fileType.startsWith('image/')) {
                const img = document.createElement('img');
                img.className = 'img-thumbnail';
                img.style.maxWidth = '200px';
                img.style.maxHeight = '200px';
                const safeUrl = sanitizeUrl(message.fileUrl);
                if (safeUrl) {
                    img.src = safeUrl;
                }
                img.alt = 'Shared image';
                container.appendChild(img);
                
                const fileNameDiv = document.createElement('div');
                fileNameDiv.className = 'mt-1';
                fileNameDiv.textContent = sanitizeText(message.fileName);
                container.appendChild(fileNameDiv);
            } else {
                const flexDiv = document.createElement('div');
                flexDiv.className = 'd-flex align-items-center';
                
                const icon = document.createElement('i');
                const iconClass = getFileIconClass(message);
                icon.className = `bi ${iconClass} fs-3 me-2`;
                flexDiv.appendChild(icon);
                
                const fileInfoDiv = document.createElement('div');
                const fileNameDiv = document.createElement('div');
                fileNameDiv.className = 'fw-bold';
                fileNameDiv.textContent = sanitizeText(message.fileName);
                fileInfoDiv.appendChild(fileNameDiv);
                
                const fileSizeDiv = document.createElement('small');
                fileSizeDiv.className = 'text-muted';
                fileSizeDiv.textContent = formatFileSize(message.fileSize);
                fileInfoDiv.appendChild(fileSizeDiv);
                
                flexDiv.appendChild(fileInfoDiv);
                
                const downloadLink = document.createElement('a');
                downloadLink.className = 'ms-2';
                const safeUrl = sanitizeUrl(message.fileUrl);
                if (safeUrl) {
                    downloadLink.href = safeUrl;
                }
                downloadLink.target = '_blank';
                const downloadIcon = document.createElement('i');
                downloadIcon.className = 'bi bi-download';
                downloadLink.appendChild(downloadIcon);
                flexDiv.appendChild(downloadLink);
                
                container.appendChild(flexDiv);
            }
            
            return container;
        }

        function getFileIconClass(message) {
            const type = message.fileType || '';
            const extension = message.fileName ? message.fileName.split('.').pop().toLowerCase() : '';
            
            if (type.includes('pdf')) return 'bi-file-earmark-pdf';
            if (type.includes('word') || extension === 'doc' || extension === 'docx') return 'bi-file-earmark-word';
            if (type.includes('excel') || extension === 'xls' || extension === 'xlsx') return 'bi-file-earmark-excel';
            if (type.includes('powerpoint') || extension === 'ppt' || extension === 'pptx') return 'bi-file-earmark-ppt';
            if (type.includes('zip') || extension === 'rar' || extension === '7z') return 'bi-file-earmark-zip';
            if (type.includes('text') || extension === 'txt') return 'bi-file-earmark-text';
            return 'bi-file-earmark';
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' bytes';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            else return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function uploadFile(file) {
            const filePath = `chat_files/${chatId}/${Date.now()}_${file.name}`;
            const fileRef = storage.ref(filePath);
            
            const messageId = 'uploading-' + Date.now();
            const uploadingElement = document.createElement('div');
            uploadingElement.className = 'message message-sent';
            uploadingElement.id = messageId;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble sent-bubble';
            
            const flexDiv = document.createElement('div');
            flexDiv.className = 'd-flex align-items-center';
            
            const spinner = document.createElement('div');
            spinner.className = 'spinner-border spinner-border-sm me-2';
            spinner.setAttribute('role', 'status');
            const spinnerText = document.createElement('span');
            spinnerText.className = 'visually-hidden';
            spinnerText.textContent = 'Loading...';
            spinner.appendChild(spinnerText);
            flexDiv.appendChild(spinner);
            
            const uploadText = document.createElement('span');
            uploadText.textContent = `Uploading ${sanitizeText(file.name)}...`;
            flexDiv.appendChild(uploadText);
            
            bubbleDiv.appendChild(flexDiv);
            uploadingElement.appendChild(bubbleDiv);
            chatMessages.appendChild(uploadingElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            const uploadTask = fileRef.put(file);
            
            uploadTask.on('state_changed', 
                (snapshot) => {
                    // Progress monitoring
                }, 
                (error) => {
                    console.error("Upload error:", error);
                    const el = document.getElementById(messageId);
                    if (el) el.remove();
                    alert("Error uploading file. Please try again.");
                }, 
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        const el = document.getElementById(messageId);
                        if (el) el.remove();
                        
                        const message = {
                            text: `Shared a file: ${file.name}`,
                            sender: currentUser.uid,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                            fileUrl: downloadURL,
                            fileName: file.name,
                            fileType: file.type,
                            fileSize: file.size
                        };
                        
                        db.collection('chats').doc(chatId).collection('messages').add(message)
                            .then(() => {
                                db.collection('chats').doc(chatId).set({
                                    lastMessage: `Shared a file: ${file.name}`,
                                    lastMessageTime: message.timestamp,
                                    participants: [currentUser.uid, friendData.id]
                                }, { merge: true });
                            })
                            .catch(error => {
                                console.error("Error sending file message:", error);
                                alert("Error sending file message. Please try again.");
                            });
                    });
                }
            );
        }

        function sendMessage() {
            const messageText = messageInput.value.trim();
            if (messageText === '') return;
            
            // Sanitize message before storing
            const sanitizedText = sanitizeText(messageText);
            
            const message = {
                text: sanitizedText,
                sender: currentUser.uid,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            db.collection('chats').doc(chatId).collection('messages').add(message)
                .then(() => {
                    db.collection('chats').doc(chatId).set({
                        lastMessage: sanitizedText,
                        lastMessageTime: message.timestamp,
                        participants: [currentUser.uid, friendData.id],
                        [`typing.${currentUser.uid}`]: false
                    }, { merge: true });
                    
                    messageInput.value = '';
                    updateCharacterCount();
                })
                .catch(error => {
                    console.error("Error sending message:", error);
                    alert("Error sending message. Please try again.");
                });
        }

        function updateCharacterCount() {
            const count = messageInput.value.length;
            characterCount.textContent = `${count}/500`;
            
            if (count > 450) {
                characterCount.style.color = '#dc3545';
            } else {
                characterCount.style.color = '#6c757d';
            }
        }

        window.addEventListener('beforeunload', () => {
            if (chatId && currentUser) {
                db.collection('chats').doc(chatId).update({
                    [`typing.${currentUser.uid}`]: false
                });
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
