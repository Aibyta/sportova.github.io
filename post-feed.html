<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSTE Social Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/emoji-picker-element"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <style>
        :root {
            --bg: #f3f4f6;
            --card: #fff;
            --text: #222;
            --subtext: #666;
            --primary: #007bff;
        }

        body.dark {
            --bg: #1e1e1e;
            --card: #2c2c2c;
            --text: #f5f5f5;
            --subtext: #bbb;
            --primary: #0d6efd;
        }

        body {
            background: var(--bg);
            padding: 2rem;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.4s, color 0.4s;
        }

        .container {
            max-width: 1100px;
            margin: auto 0 0 5rem;
        }

        .post-card {
            background: var(--card);
            color: var(--text);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            animation: fadeSlide .5s ease;
        }

        .media {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: .75rem;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            margin-right: 12px;
            color: var(--subtext);
            cursor: pointer;
            transition: transform .2s, color .2s;
        }

        .icon-btn:hover {
            transform: scale(1.2);
            color: var(--primary);
        }

        .icon-liked {
            color: red !important;
        }

        .comment-box {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease;
        }

        .comment-box.open {
            max-height: 600px;
            margin-top: 1rem;
        }

        emoji-picker {
            position: absolute;
            z-index: 1000;
        }

        .comment {
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        .comment-user {
            font-weight: 600;
            color: var(--text);
        }

        .comment-time {
            color: var(--subtext);
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }

        .comment-text {
            display: block;
            margin-top: 2px;
            margin-left: 0.5rem;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dark-toggle {
            position: fixed;
            top: 1rem;
            right: 2rem;
            z-index: 999;
            background: var(--card);
            color: var(--text);
            border: none;
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: background 0.3s, color 0.3s;
        }
    </style>
</head>

<body>
    <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>

    <div class="container">
        <form id="postForm" class="mb-4 shadow p-4 rounded" style="background: var(--card); color: var(--text);">
            <h1 class="text-4xl font-bold text-gray-800 mb-2" id="title">NSTE Social Feed</h1>
            <input type="text" id="caption" class="form-control mb-2" placeholder="Write a caption..." required />
            <input type="url" id="mediaUrl" class="form-control mb-2" placeholder="Paste image or video URL" required />
            <select id="mediaType" class="form-select mb-3">
                <option value="image">🖼 Image</option>
                <option value="video">🎥 Video</option>
            </select>
            <button class="btn btn-primary w-100">Post</button>
        </form>

        <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search by username or caption..." />

        <div id="postFeed"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore, collection, addDoc, serverTimestamp, query, orderBy,
            onSnapshot, updateDoc, doc, deleteDoc, getDoc, arrayUnion, arrayRemove
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjMwv9Bxff1bUE7CR_S-DPx3NV5kkinTU",
            authDomain: "nste-booking-system.firebaseapp.com",
            projectId: "nste-booking-system",
            storageBucket: "nste-booking-system.appspot.com",
            messagingSenderId: "574207536433",
            appId: "1:574207536433:web:0d2aeaacdc280cec019410"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth();
        let currentUser = null;
        const userNamesCache = {};

        const postForm = document.getElementById("postForm");
        const postFeed = document.getElementById("postFeed");
        const searchInput = document.getElementById("searchInput");

        // Security: Sanitize text content (remove all HTML)
        function sanitizeText(text) {
            if (!text) return '';
            // Create a temporary element and use textContent to strip HTML
            const temp = document.createElement('div');
            temp.textContent = text;
            return temp.textContent;
        }

        // Security: Validate and sanitize URLs
        function sanitizeUrl(url) {
            if (!url) return '';
            try {
                const parsedUrl = new URL(url);
                // Only allow http and https protocols
                if (parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:') {
                    return '';
                }
                // Additional: restrict to common image/video domains if needed
                return url;
            } catch (e) {
                return '';
            }
        }

        // Security: Create safe DOM elements using textContent and setAttribute
        function createSafeElement(tag, content, attributes = {}) {
            const element = document.createElement(tag);
            
            if (content !== undefined && content !== null) {
                element.textContent = content;
            }
            
            for (const [key, value] of Object.entries(attributes)) {
                if (key === 'src' || key === 'href') {
                    element.setAttribute(key, sanitizeUrl(value));
                } else {
                    element.setAttribute(key, value);
                }
            }
            
            return element;
        }

        const darkToggle = document.getElementById("darkToggle");
        darkToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            const isDark = document.body.classList.contains("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
        });
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark");
        }

        async function getUserName(uid) {
            if (userNamesCache[uid]) return userNamesCache[uid];
            const snap = await getDoc(doc(db, "users", uid));
            const name = snap.exists() ? snap.data().name : uid;
            // Sanitize the name before caching
            userNamesCache[uid] = sanitizeText(name);
            return userNamesCache[uid];
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    userNamesCache[user.uid] = sanitizeText(snap.data().name);
                }
                fetchPosts();
            } else {
                alert("Please sign in to use the app.");
                window.location.href = "/login";
            }
        });

        postForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const caption = document.getElementById("caption").value;
            const mediaUrl = document.getElementById("mediaUrl").value;
            const mediaType = document.getElementById("mediaType").value;
            
            // Sanitize input before storing
            const sanitizedCaption = sanitizeText(caption);
            const sanitizedMediaUrl = sanitizeUrl(mediaUrl);
            
            await addDoc(collection(db, "posts"), {
                caption: sanitizedCaption,
                mediaUrl: sanitizedMediaUrl,
                type: mediaType,
                userId: currentUser.uid,
                likes: [],
                timestamp: serverTimestamp()
            });
            postForm.reset();
        });

        function fetchPosts() {
            const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
            onSnapshot(q, async (snapshot) => {
                const posts = [];
                for (const docSnap of snapshot.docs) {
                    const post = docSnap.data();
                    const userName = await getUserName(post.userId);
                    posts.push({ ...post, id: docSnap.id, userName });
                }
                displayPosts(posts);
            });
        }

        function displayPosts(posts) {
            const search = searchInput.value.toLowerCase();
            const filtered = posts.filter(p =>
                p.caption.toLowerCase().includes(search) ||
                p.userName.toLowerCase().includes(search)
            );
            
            // Clear feed using textContent to prevent XSS
            while (postFeed.firstChild) {
                postFeed.removeChild(postFeed.firstChild);
            }
            
            filtered.forEach(post => renderPost(post));
        }

        function renderPost(post) {
            const isOwner = post.userId === currentUser.uid;
            const liked = post.likes?.includes(currentUser.uid);
            const likeCount = post.likes?.length || 0;

            // Sanitize all user data
            const safeUserName = sanitizeText(post.userName);
            const safeCaption = sanitizeText(post.caption);
            const safeMediaUrl = sanitizeUrl(post.mediaUrl);

            // Create post card using DOM APIs
            const postCard = document.createElement('div');
            postCard.className = 'post-card';

            // User info - using textContent
            const userInfo = document.createElement('div');
            const em = document.createElement('em');
            const textNode1 = document.createTextNode('Posted by: ');
            const strong = document.createElement('strong');
            strong.textContent = safeUserName;
            em.appendChild(textNode1);
            em.appendChild(strong);
            userInfo.appendChild(em);
            postCard.appendChild(userInfo);

            // Media - using setAttribute
            const mediaContainer = document.createElement('div');
            if (post.type === 'video') {
                const video = document.createElement('video');
                video.className = 'media';
                video.controls = true;
                if (safeMediaUrl) {
                    video.setAttribute('src', safeMediaUrl);
                }
                mediaContainer.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.className = 'media';
                if (safeMediaUrl) {
                    img.setAttribute('src', safeMediaUrl);
                }
                img.setAttribute('alt', 'Post Media');
                mediaContainer.appendChild(img);
            }
            postCard.appendChild(mediaContainer);

            // Caption and actions
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'mt-2 d-flex justify-content-between align-items-start';

            const captionDiv = document.createElement('div');
            const captionStrong = document.createElement('strong');
            captionStrong.textContent = safeCaption;
            captionDiv.appendChild(captionStrong);
            actionsDiv.appendChild(captionDiv);

            if (isOwner) {
                const ownerActions = document.createElement('div');
                
                const editBtn = document.createElement('button');
                editBtn.className = 'icon-btn';
                editBtn.innerHTML = '<i class="fas fa-pen"></i>';
                editBtn.setAttribute('onclick', `editPost('${post.id}')`);
                ownerActions.appendChild(editBtn);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'icon-btn';
                deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                deleteBtn.setAttribute('onclick', `deletePost('${post.id}')`);
                ownerActions.appendChild(deleteBtn);
                
                actionsDiv.appendChild(ownerActions);
            }
            postCard.appendChild(actionsDiv);

            // Interactions
            const interactionDiv = document.createElement('div');
            interactionDiv.className = 'mt-2 d-flex align-items-center';

            const likeBtn = document.createElement('button');
            likeBtn.className = `icon-btn ${liked ? 'icon-liked' : ''}`;
            likeBtn.innerHTML = '<i class="fas fa-heart"></i>';
            likeBtn.setAttribute('onclick', `likePost(event,'${post.id}')`);
            interactionDiv.appendChild(likeBtn);

            const likeCountSpan = document.createElement('span');
            likeCountSpan.className = 'me-3';
            likeCountSpan.textContent = likeCount;
            interactionDiv.appendChild(likeCountSpan);

            const commentBtn = document.createElement('button');
            commentBtn.className = 'icon-btn';
            commentBtn.innerHTML = '<i class="fas fa-comment"></i>';
            commentBtn.setAttribute('onclick', `toggleCommentBox('${post.id}', true)`);
            interactionDiv.appendChild(commentBtn);

            const commentCountSpan = document.createElement('span');
            commentCountSpan.id = `commentCount-${post.id}`;
            commentCountSpan.className = 'ms-2 small text-muted';
            commentCountSpan.textContent = '0';
            interactionDiv.appendChild(commentCountSpan);

            postCard.appendChild(interactionDiv);

            // Comment box
            const commentBox = document.createElement('div');
            commentBox.id = `commentBox-${post.id}`;
            commentBox.className = 'comment-box';
            postCard.appendChild(commentBox);

            postFeed.appendChild(postCard);
        }

        searchInput.addEventListener("input", fetchPosts);

        window.likePost = async (e, postId) => {
            e.stopPropagation();
            const ref = doc(db, "posts", postId);
            const snap = await getDoc(ref);
            const likes = snap.data().likes || [];
            const liked = likes.includes(currentUser.uid);
            await updateDoc(ref, {
                likes: liked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
            });
        };

        window.toggleCommentBox = async (postId, init = false) => {
            const box = document.getElementById(`commentBox-${postId}`);
            box.classList.toggle("open");

            if (init && box.children.length === 0) {
                // Create comment container using DOM APIs
                const commentContainer = document.createElement('div');
                commentContainer.style.position = 'relative';

                const picker = document.createElement('emoji-picker');
                commentContainer.appendChild(picker);

                const input = document.createElement('input');
                input.id = `commentInput-${postId}`;
                input.className = 'form-control comment-input mt-2';
                input.placeholder = 'Write a comment...';
                commentContainer.appendChild(input);

                const commentBtn = document.createElement('button');
                commentBtn.className = 'btn btn-sm btn-outline-primary mt-2';
                commentBtn.textContent = 'Comment';
                commentBtn.setAttribute('onclick', `addComment('${postId}')`);
                commentContainer.appendChild(commentBtn);

                box.appendChild(commentContainer);

                const commentList = document.createElement('ul');
                commentList.id = `commentList-${postId}`;
                commentList.className = 'list-unstyled mt-3';
                box.appendChild(commentList);

                picker.addEventListener('emoji-click', (e) => {
                    input.value += e.detail.unicode;
                });

                loadComments(postId);
            }
        };

        window.addComment = async (postId) => {
            const input = document.getElementById(`commentInput-${postId}`);
            const comment = input.value.trim();
            if (!comment) return;
            
            const sanitizedComment = sanitizeText(comment);
            
            await addDoc(collection(db, "posts", postId, "comments"), {
                userId: currentUser.uid,
                comment: sanitizedComment,
                timestamp: serverTimestamp()
            });
            input.value = "";
        };

        async function loadComments(postId) {
            const ul = document.getElementById(`commentList-${postId}`);
            if (!ul) return;
            onSnapshot(query(collection(db, "posts", postId, "comments"), orderBy("timestamp")), async (snap) => {
                // Clear using DOM API
                while (ul.firstChild) {
                    ul.removeChild(ul.firstChild);
                }
                
                for (const commentDoc of snap.docs) {
                    const c = commentDoc.data();
                    const commentId = commentDoc.id;
                    const name = await getUserName(c.userId);
                    const time = c.timestamp?.toDate ? moment(c.timestamp.toDate()).fromNow() : '';
                    const isOwner = currentUser && currentUser.uid === c.userId;

                    // Sanitize comment data
                    const safeName = sanitizeText(name);
                    const safeComment = sanitizeText(c.comment);
                    const safeTime = sanitizeText(time);

                    const li = document.createElement('li');
                    li.className = 'comment';

                    // Comment header
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'd-flex justify-content-between align-items-center';

                    const userDiv = document.createElement('div');
                    
                    const userSpan = document.createElement('span');
                    userSpan.className = 'comment-user';
                    userSpan.textContent = safeName;
                    userDiv.appendChild(userSpan);

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'comment-time';
                    timeSpan.textContent = safeTime;
                    userDiv.appendChild(timeSpan);

                    headerDiv.appendChild(userDiv);

                    if (isOwner) {
                        const deleteIcon = document.createElement('i');
                        deleteIcon.className = 'fas fa-trash text-danger';
                        deleteIcon.style.cursor = 'pointer';
                        deleteIcon.setAttribute('onclick', `deleteComment('${postId}', '${commentId}')`);
                        headerDiv.appendChild(deleteIcon);
                    }

                    li.appendChild(headerDiv);

                    // Comment text
                    const commentTextSpan = document.createElement('span');
                    commentTextSpan.className = 'comment-text';
                    commentTextSpan.textContent = safeComment;
                    li.appendChild(commentTextSpan);

                    ul.appendChild(li);
                }
                
                const commentCount = document.getElementById(`commentCount-${postId}`);
                if (commentCount) {
                    commentCount.textContent = snap.size;
                }
            });
        }

        window.deleteComment = async (postId, commentId) => {
            if (confirm("Delete this comment?")) {
                await deleteDoc(doc(db, "posts", postId, "comments", commentId));
            }
        };

        window.editPost = async (postId) => {
            const ref = doc(db, "posts", postId);
            const snap = await getDoc(ref);
            const post = snap.data();
            const caption = prompt("Edit caption:", post.caption);
            const mediaUrl = prompt("Edit media URL:", post.mediaUrl);
            if (caption !== null && mediaUrl !== null) {
                const sanitizedCaption = sanitizeText(caption);
                const sanitizedMediaUrl = sanitizeUrl(mediaUrl);
                await updateDoc(ref, { 
                    caption: sanitizedCaption, 
                    mediaUrl: sanitizedMediaUrl 
                });
            }
        };

        window.deletePost = async (postId) => {
            if (confirm("Are you sure?")) {
                await deleteDoc(doc(db, "posts", postId));
            }
        };
    </script>
</body>

</html>
